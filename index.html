<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Toy Game — Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0d;
    --surface: #1a1917;
    --surface2: #222120;
    --border: #2e2c2a;
    --border2: #3d3a37;
    --accent: #e8572a;
    --accent2: #f5a623;
    --text: #f0ede8;
    --text2: #9b9690;
    --text3: #615e59;
    --green: #4caf82;
    --amber: #e8a020;
    --red: #e05050;
    --radius: 6px;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans Thai', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 50;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .logo span { color: var(--accent); }
  .logo em { color: var(--text3); font-style: normal; font-size: 11px; margin-left: 8px; font-weight: 400; }

  #conn-status {
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text2);
  }
  #conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text3);
    transition: background .3s;
  }
  #conn-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #conn-dot.err { background: var(--red); }

  /* METRICS */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .metric {
    padding: 1.1rem 1.5rem;
    border-right: 1px solid var(--border);
  }
  .metric:last-child { border-right: none; }
  .metric-label {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text3);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .metric-val {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }
  .metric-val.g { color: var(--green); }
  .metric-val.a { color: var(--amber); }
  .metric-val.r { color: var(--accent); }

  /* TOOLBAR */
  .toolbar {
    padding: .75rem 1.5rem;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .toolbar input[type=text],
  .toolbar select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0 10px;
    height: 32px;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .toolbar input[type=text] { min-width: 200px; flex: 1; }
  .toolbar input[type=text]:focus,
  .toolbar select:focus { border-color: var(--accent); }
  .toolbar select option { background: #1a1917; }

  .btn {
    height: 32px;
    padding: 0 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--border2); background: var(--border); }
  .btn.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  .btn.accent:hover { background: #d04820; border-color: #d04820; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
  }
  thead th {
    background: var(--surface);
    color: var(--text3);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-weight: 400;
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:hover { background: var(--surface); }
  tbody td {
    padding: 10px 14px;
    font-size: 13px;
    vertical-align: middle;
  }
  .item-name { font-weight: 500; color: var(--text); }
  .item-notes { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* BADGES */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: .03em;
    white-space: nowrap;
  }
  .b-available { background: rgba(76,175,130,.15); color: var(--green); border: 1px solid rgba(76,175,130,.3); }
  .b-reserved   { background: rgba(232,160,32,.15); color: var(--amber); border: 1px solid rgba(232,160,32,.3); }
  .b-sold       { background: rgba(224,80,80,.15);  color: var(--red);   border: 1px solid rgba(224,80,80,.3); }
  .b-mint  { background: rgba(76,175,130,.1);  color: var(--green); }
  .b-good  { background: rgba(100,160,255,.1); color: #79aaff; }
  .b-fair  { background: rgba(232,160,32,.1);  color: var(--amber); }
  .b-poor  { background: rgba(224,80,80,.1);   color: var(--red); }
  .b-type  { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }

  .price-cell { font-family: var(--mono); font-size: 13px; color: var(--accent2); }
  .loc-cell   { font-family: var(--mono); font-size: 12px; color: var(--text2); }

  .row-actions { display: flex; gap: 5px; }
  .ra {
    padding: 3px 8px;
    font-size: 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-family: var(--sans);
    transition: all .15s;
  }
  .ra:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
  .ra.sell:hover { color: var(--green); border-color: rgba(76,175,130,.4); }
  .ra.res:hover  { color: var(--amber); border-color: rgba(232,160,32,.4); }
  .ra.del:hover  { color: var(--red);   border-color: rgba(224,80,80,.4); }

  /* EMPTY */
  .empty {
    padding: 4rem;
    text-align: center;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 13px;
  }

  /* LOADING */
  .loading {
    padding: 3rem;
    text-align: center;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .05em;
  }
  .spin {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 1.5rem;
    width: min(520px, 96vw);
    max-height: 92vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .modal-title { font-size: 15px; font-weight: 600; font-family: var(--mono); }
  .modal-close {
    background: none; border: none; color: var(--text3);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 2px 6px;
  }
  .modal-close:hover { color: var(--text); }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 11px; font-family: var(--mono); color: var(--text3); letter-spacing: .05em; text-transform: uppercase; }
  .field input, .field select, .field textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field select option { background: var(--surface); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.25rem; }

  /* TOAST */
  #toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: .7rem 1.1rem;
    border-radius: var(--radius);
    font-size: 13px;
    z-index: 999;
    opacity: 0;
    transform: translateY(8px);
    transition: all .2s;
    pointer-events: none;
    font-family: var(--sans);
    max-width: 280px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok { border-left: 3px solid var(--green); }
  #toast.err { border-left: 3px solid var(--red); }

  @media (max-width: 600px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .metric { border-bottom: 1px solid var(--border); }
    .metric-val { font-size: 20px; }
    header { padding: 0 1rem; }
    .toolbar { padding: .6rem 1rem; }
    .toolbar input[type=text] { min-width: 140px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>T-TOY</span> GAME <em>inventory</em></div>
  <div id="conn-status">
    <div id="conn-dot"></div>
    <span id="conn-label">connecting...</span>
  </div>
</header>

<div class="metrics" id="metrics">
  <div class="metric"><div class="metric-label">In Stock</div><div class="metric-val" id="m-total">—</div></div>
  <div class="metric"><div class="metric-label">Available</div><div class="metric-val g" id="m-avail">—</div></div>
  <div class="metric"><div class="metric-label">Reserved</div><div class="metric-val a" id="m-res">—</div></div>
  <div class="metric"><div class="metric-label">Stock Value</div><div class="metric-val r" id="m-val">—</div></div>
</div>

<div class="toolbar">
  <input type="text" id="q" placeholder="ค้นหา ชื่อ, platform, ที่เก็บ..." oninput="render()">
  <select id="f-type" onchange="render()">
    <option value="">ทุกประเภท</option>
    <option>Console</option>
    <option>Game</option>
    <option>Accessory</option>
  </select>
  <select id="f-status" onchange="render()">
    <option value="">ทุกสถานะ</option>
    <option>Available</option>
    <option>Reserved</option>
    <option>Sold</option>
  </select>
  <select id="f-console" onchange="render()">
    <option value="">ทุก platform</option>
  </select>
  <select id="f-sort" onchange="render()">
    <option value="new">ใหม่สุดก่อน</option>
    <option value="old">เก่าสุดก่อน</option>
    <option value="price_asc">ราคา ต่ำ→สูง</option>
    <option value="price_desc">ราคา สูง→ต่ำ</option>
    <option value="name">ชื่อ A→Z</option>
  </select>
  <button class="btn accent" onclick="openAdd()">+ เพิ่มรายการ</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>รายการ</th>
        <th>Platform</th>
        <th>สภาพ</th>
        <th>ราคา (฿)</th>
        <th>ที่เก็บ</th>
        <th>สถานะ</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7"><div class="loading"><span class="spin"></span>กำลังโหลด...</div></td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">เพิ่มรายการใหม่</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="field-row">
      <div class="field">
        <label>ประเภท</label>
        <select id="f-mtype">
          <option>Console</option>
          <option>Game</option>
          <option>Accessory</option>
        </select>
      </div>
      <div class="field">
        <label>Platform / Console</label>
        <input id="f-mconsole" list="cl" placeholder="เช่น SNES, PS2, GBA">
        <datalist id="cl">
          <option>NES</option><option>SNES</option><option>Super Famicom</option>
          <option>Nintendo 64</option><option>GameCube</option><option>Wii</option>
          <option>Game Boy</option><option>Game Boy Color</option><option>Game Boy Advance</option>
          <option>Nintendo DS</option><option>Nintendo 3DS</option>
          <option>PlayStation</option><option>PlayStation 2</option><option>PlayStation 3</option>
          <option>PlayStation Portable</option><option>PlayStation Vita</option>
          <option>Sega Mega Drive</option><option>Sega Saturn</option><option>Sega Dreamcast</option>
          <option>Xbox</option><option>Xbox 360</option><option>Atari 2600</option><option>Neo Geo</option>
        </datalist>
      </div>
    </div>
    <div class="field">
      <label>ชื่อรายการ</label>
      <input id="f-mtitle" placeholder="เช่น Super Mario World, PS2 Console (Black)">
    </div>
    <div class="field-row">
      <div class="field">
        <label>สภาพ</label>
        <select id="f-mcond">
          <option>Mint</option><option>Good</option><option>Fair</option><option>Poor</option>
        </select>
      </div>
      <div class="field">
        <label>ราคา (฿)</label>
        <input id="f-mprice" type="number" min="0" placeholder="0">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>ที่เก็บ</label>
        <input id="f-mloc" list="ll" placeholder="เช่น Shelf A1, Box 3">
        <datalist id="ll"></datalist>
      </div>
      <div class="field">
        <label>สถานะ</label>
        <select id="f-mstatus">
          <option>Available</option><option>Reserved</option><option>Sold</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>หมายเหตุ</label>
      <textarea id="f-mnotes" placeholder="เช่น มีกล่อง, ทดสอบแล้ว, ขาดสาย..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">ยกเลิก</button>
      <button class="btn accent" id="save-btn" onclick="saveItem()">บันทึก</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPA_URL = 'https://msmoswrwaftbsskdzrep.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zbW9zd3J3YWZ0YnNza2R6cmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NzE5MTQsImV4cCI6MjA5MTE0NzkxNH0.O98JA2X8Ixh53wpSY44FQLmbo1poyqADR6CAvGWeR3c';
const H = { 'Content-Type':'application/json', 'apikey': SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Prefer':'return=representation' };

let items = [];
let editId = null;

async function api(method, path, body) {
  const r = await fetch(SUPA_URL + '/rest/v1/' + path, {
    method, headers: H,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function load() {
  try {
    items = await api('GET', 'inventory?select=*&order=created_at.desc') || [];
    setConn(true);
    render();
  } catch(e) {
    setConn(false);
    document.getElementById('tbody').innerHTML = `<tr><td colspan="7"><div class="empty">⚠ ไม่สามารถเชื่อมต่อ Supabase ได้<br><small style="color:var(--text3);font-size:11px">${e.message}</small></div></td></tr>`;
  }
}

function setConn(ok) {
  document.getElementById('conn-dot').className = ok ? 'ok' : 'err';
  document.getElementById('conn-label').textContent = ok ? 'connected' : 'error';
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const ft = document.getElementById('f-type').value;
  const fs = document.getElementById('f-status').value;
  const fc = document.getElementById('f-console').value;
  const sort = document.getElementById('f-sort').value;

  // update platform filter
  const consoles = [...new Set(items.map(i => i.console).filter(Boolean))].sort();
  const fcEl = document.getElementById('f-console');
  const prev = fcEl.value;
  fcEl.innerHTML = '<option value="">ทุก platform</option>' + consoles.map(c => `<option${c===prev?' selected':''}>${c}</option>`).join('');

  let list = items.filter(it => {
    if (ft && it.type !== ft) return false;
    if (fs && it.status !== fs) return false;
    if (fc && it.console !== fc) return false;
    if (q && !([it.title,it.console,it.location,it.notes||''].join(' ').toLowerCase().includes(q))) return false;
    return true;
  });

  list.sort((a,b) => {
    if (sort==='price_asc') return a.price-b.price;
    if (sort==='price_desc') return b.price-a.price;
    if (sort==='name') return a.title.localeCompare(b.title);
    if (sort==='old') return new Date(a.created_at)-new Date(b.created_at);
    return new Date(b.created_at)-new Date(a.created_at);
  });

  // metrics
  const instock = items.filter(i => i.status !== 'Sold');
  document.getElementById('m-total').textContent = instock.length;
  document.getElementById('m-avail').textContent = items.filter(i=>i.status==='Available').length;
  document.getElementById('m-res').textContent = items.filter(i=>i.status==='Reserved').length;
  const val = items.filter(i=>i.status==='Available').reduce((s,i)=>s+(i.price||0),0);
  document.getElementById('m-val').textContent = '฿'+val.toLocaleString();

  // update location datalist
  const locs = [...new Set(items.map(i=>i.location).filter(Boolean))];
  document.getElementById('ll').innerHTML = locs.map(l=>`<option>${l}</option>`).join('');

  const tbody = document.getElementById('tbody');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty">ไม่พบรายการที่ตรงกับเงื่อนไข</div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(it => `
    <tr>
      <td>
        <div class="item-name">${esc(it.title)}</div>
        ${it.notes ? `<div class="item-notes">${esc(it.notes.slice(0,70))}${it.notes.length>70?'…':''}</div>` : ''}
      </td>
      <td><span class="badge b-type">${esc(it.console||'')}</span><br><span style="font-size:11px;color:var(--text3)">${it.type||''}</span></td>
      <td><span class="badge b-${(it.condition||'').toLowerCase()}">${it.condition||'—'}</span></td>
      <td class="price-cell">฿${(it.price||0).toLocaleString()}</td>
      <td class="loc-cell">${esc(it.location||'—')}</td>
      <td><span class="badge b-${(it.status||'').toLowerCase()}">${it.status||'—'}</span></td>
      <td>
        <div class="row-actions">
          <button class="ra" onclick="openEdit(${it.id})">แก้ไข</button>
          ${it.status!=='Reserved'?`<button class="ra res" onclick="setStatus(${it.id},'Reserved')">จอง</button>`:''}
          ${it.status!=='Sold'?`<button class="ra sell" onclick="setStatus(${it.id},'Sold')">ขายแล้ว</button>`:''}
          ${it.status==='Sold'?`<button class="ra" onclick="setStatus(${it.id},'Available')">คืนสต็อก</button>`:''}
          <button class="ra del" onclick="delItem(${it.id})">ลบ</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function openAdd() {
  editId = null;
  document.getElementById('modal-title').textContent = 'เพิ่มรายการใหม่';
  ['f-mtype','f-mconsole','f-mtitle','f-mcond','f-mprice','f-mloc','f-mstatus','f-mnotes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = el.tagName==='SELECT' ? el.options[0].value : '';
  });
  document.getElementById('modal').style.display = 'flex';
}

function openEdit(id) {
  const it = items.find(x=>x.id===id); if(!it) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'แก้ไขรายการ';
  document.getElementById('f-mtype').value = it.type||'Console';
  document.getElementById('f-mconsole').value = it.console||'';
  document.getElementById('f-mtitle').value = it.title||'';
  document.getElementById('f-mcond').value = it.condition||'Good';
  document.getElementById('f-mprice').value = it.price||'';
  document.getElementById('f-mloc').value = it.location||'';
  document.getElementById('f-mstatus').value = it.status||'Available';
  document.getElementById('f-mnotes').value = it.notes||'';
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function saveItem() {
  const title = document.getElementById('f-mtitle').value.trim();
  const console_ = document.getElementById('f-mconsole').value.trim();
  if (!title) { toast('กรุณาใส่ชื่อรายการ','err'); return; }
  if (!console_) { toast('กรุณาใส่ platform','err'); return; }
  const btn = document.getElementById('save-btn');
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  const body = {
    type: document.getElementById('f-mtype').value,
    console: console_,
    title,
    condition: document.getElementById('f-mcond').value,
    price: parseFloat(document.getElementById('f-mprice').value)||0,
    location: document.getElementById('f-mloc').value.trim(),
    status: document.getElementById('f-mstatus').value,
    notes: document.getElementById('f-mnotes').value.trim()
  };
  try {
    if (editId) {
      const res = await api('PATCH', `inventory?id=eq.${editId}`, body);
      const idx = items.findIndex(x=>x.id===editId);
      if (idx>=0) items[idx] = {...items[idx], ...body};
      toast('บันทึกสำเร็จ ✓','ok');
    } else {
      const res = await api('POST', 'inventory', body);
      if (res && res[0]) items.unshift(res[0]);
      toast('เพิ่มรายการแล้ว ✓','ok');
    }
    closeModal(); render();
  } catch(e) { toast('เกิดข้อผิดพลาด: '+e.message,'err'); }
  btn.textContent = 'บันทึก'; btn.disabled = false;
}

async function setStatus(id, status) {
  try {
    await api('PATCH', `inventory?id=eq.${id}`, { status });
    const it = items.find(x=>x.id===id);
    if (it) it.status = status;
    render();
    toast(status==='Sold'?'ทำเครื่องหมายขายแล้ว ✓':status==='Reserved'?'จองแล้ว ✓':'คืนสต็อกแล้ว ✓','ok');
  } catch(e) { toast('เกิดข้อผิดพลาด','err'); }
}

async function delItem(id) {
  if (!confirm('ลบรายการนี้ออกจากคลัง?')) return;
  try {
    await api('DELETE', `inventory?id=eq.${id}`);
    items = items.filter(x=>x.id!==id);
    render(); toast('ลบแล้ว','ok');
  } catch(e) { toast('เกิดข้อผิดพลาด','err'); }
}

let toastTimer;
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show '+type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className=''; },2800);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

load();
</script>
